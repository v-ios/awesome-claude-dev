# .swiftlint.yml — baseline for an iOS + tvOS app with layered modules.
# Key names from the SwiftLint README; the custom_rules shape and the two architecture rules follow
# tomada1114/ios-template (research/notes/governance_and_context_engineering.md KQ8).
# composed: the rule selection below is a starting point; run `swiftlint rules` and prune for your repo.

strict: true            # warnings fail the hook, `swiftlint lint --strict` in CI, and the Stop gate's lint step

excluded:
  - .build
  - .derivedData
  - DerivedData
  - build
  - Pods
  - Tuist
  - Derived
  - .claude/worktrees
  - "**/Generated"
  - "**/*.generated.swift"
  - "**/Package.swift"

# Opt-in rules that catch the defect classes practitioners report for agent-written Swift
# (force unwraps, concurrency/memory mistakes, test-framework mixing). Names must exist in `swiftlint rules`.
opt_in_rules:
  - force_unwrapping            # no `!` in app code (tests may opt out via a nested .swiftlint.yml)
  - implicitly_unwrapped_optional
  - unowned_variable_capture    # "Prefer capturing references as weak to avoid potential crashes"
  - weak_delegate               # "Delegates should be weak to avoid reference cycles"
  - strong_iboutlet
  - private_outlet
  - discouraged_optional_boolean
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Analyzer rules run ONLY under `swiftlint analyze --compiler-log-path xcodebuild.log` (see ci/ios-guardrails.yml,
# optional job). They never fire in the PostToolUse hook; listing them here is harmless but do not expect them there.
analyzer_rules:
  - unused_import
  - unused_declaration
  - capture_variable

# Default-rule tuning. ios-template keeps SwiftLint's own limits (file 400 lines, function body 50, params 5).
line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true
file_length:
  warning: 400
  error: 600
function_body_length:
  warning: 50
  error: 80
type_body_length:
  warning: 250
  error: 400
identifier_name:
  min_length: 2
  excluded: [id, x, y, z, i, j, ok, tv]
trailing_comma:
  mandatory_comma: true        # aligned with SwiftFormat --commas (see .swiftformat)
number_separator:
  minimum_length: 5            # aligned with SwiftFormat --decimalgrouping 3,4
nesting:
  type_level: 2

custom_rules:
  # Core must stay free of UI, persistence and OS-integration frameworks. Enforced twice more:
  # Tests/ArchitectureBoundaryTests.swift (test job) and scripts/arch-check.sh (CI + architecture-guardian).
  # `included`/`excluded` are substring regexes against the whole file path, not repository-relative globs.
  # Replace `MyAppCore` with your core module's source directory.
  no_ui_import_in_core:
    included: 'Sources/MyAppCore/.+\.swift$'
    regex: '^\s*(@[\w()]+\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?(SwiftUI|UIKit|AppKit|Cocoa|TVUIKit|TVServices|SwiftData|CoreData|CloudKit|UserNotifications|CoreLocation|Photos|PhotosUI|StoreKit|WidgetKit)\b'
    message: "Core must not import a UI, persistence, or OS-integration framework; put the adapter in the Platform layer behind a Core port (.claude/rules/architecture.md)."
    severity: error

  # UI and Platform are siblings over Core and never import each other.
  no_sibling_import_in_ui:
    included: 'Sources/MyAppUI/.+\.swift$'
    regex: '^\s*(@[\w()]+\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?MyAppPlatform\b'
    message: "MyAppUI must not import MyAppPlatform; depend on a Core port instead (.claude/rules/architecture.md)."
    severity: error
  no_sibling_import_in_platform:
    included: 'Sources/MyAppPlatform/.+\.swift$'
    regex: '^\s*(@[\w()]+\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?(MyAppUI|SwiftUI)\b'
    message: "MyAppPlatform must not import MyAppUI or SwiftUI (.claude/rules/architecture.md)."
    severity: error

  # Shipped code logs through os.Logger. print() output is discarded for an app launched from the Home Screen.
  no_print_in_sources:
    included: '(^|/)(App/[^/]+|Sources/[^/]+/.+)\.swift$'
    excluded: '(^|/)[A-Za-z0-9]*Tests/'
    regex: '(^|[^\w.])(?<!func )(print|debugPrint|NSLog)\s*\('
    match_kinds:
      - identifier
    message: "Shipped code must not print to stdout; log through os.Logger with a privacy annotation on user-derived values (.claude/rules/swift.md)."
    severity: error

  # `.disabled()` on tvOS removes the view from the focus engine entirely; gate it with #if os(iOS) or use a
  # focusable-but-inert state (.claude/rules/tvos.md). Scoped to shared/tvOS view code.
  no_disabled_modifier_in_tvos_views:
    included: '(tvOS|TV)[^/]*/.+\.swift$'
    regex: '\.disabled\('
    message: "`.disabled()` breaks tvOS focus navigation; keep the view focusable and ignore the action instead, or wrap in #if os(iOS) (.claude/rules/tvos.md)."
    severity: warning

  # Suppressing a gate needs human sign-off (CLAUDE.md > Needs human sign-off).
  no_swiftlint_disable:
    regex: '//\s*swiftlint:disable'
    excluded: '(^|/)[A-Za-z0-9]*Tests/'
    message: "// swiftlint:disable needs explicit human approval; fix the code instead."
    severity: error
  no_unchecked_sendable_without_proof:
    regex: '@unchecked Sendable(?![^\n]*//)'
    message: "@unchecked Sendable needs a same-line comment proving the invariant it papers over (.claude/rules/swift.md)."
    severity: error
  no_nonisolated_unsafe_without_proof:
    regex: 'nonisolated\(unsafe\)(?![^\n]*//)'
    message: "nonisolated(unsafe) needs a same-line comment proving why the access is safe (.claude/rules/swift.md)."
    severity: error

reporter: xcode
